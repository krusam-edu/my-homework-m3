<svg xmlns="http://www.w3.org/2000/svg" width="670.8000000000001" height="1086" viewBox="0 0 670.8000000000001 1086" role="img" aria-labelledby="title desc"><title id="title">Blocks 6 — ลบรายการที่เลือก</title><desc id="desc">btnDelete → ลาก when btnDelete.Click; Control → if then ใส่ do แล้วใช้เฟืองเพิ่ม else Logic → ลาก and เสียบเงื่อนไข if Math → ลากบล็อกเปรียบเทียบ เลือก &gt; เสียบช่องแรกของ and แล้วใส่ ListView1.SelectionIndex ทางซ้ายและเลข 0 ทางขวา Math → ลากบล็อกเปรียบเทียบอีกชิ้น เลือก ≤ เสียบช่องที่สองของ and; ใส่ ListView1.SelectionIndex ทางซ้าย Lists → ลาก length of list เสียบด้านขวาของ ≤ แล้ว Variables → get global homeworkList เสียบ list Lists → ลาก remove list item ใส่ then; get global homeworkList เสียบ list และ ListView1.SelectionIndex เสียบ index TinyDB1 → ลาก StoreValue ต่อใต้ remove ใน then ใส่ข้อความ homework ใน tag และ get global homeworkList ใน valueToStore Procedures → ลาก call RefreshList ต่อด้านล่างใน then ListView1 → ลาก set ListView1.SelectionIndex to ต่อใน then แล้วเสียบ Math → เลข 0 เพื่อยกเลิกการเลือกเดิม Notifier1 → ลาก ShowAlert ต่อท้าย then ใส่ข้อความ ลบรายการเรียบร้อย Notifier1 → ลาก ShowAlert อีกชิ้นใส่ else แล้วเสียบข้อความ กรุณาเลือกรายการที่ต้องการลบ</desc><style>text{font-family:Arial,Tahoma,sans-serif;font-size:14px;fill:white}svg{background:#f5f7fa}</style><g transform="translate(24 16)"><path d="M0 0 H622.8000000000001 V60 H76 l-6 6 H58 l-6 -6 H32 V1030 H52 l6 6 h12 l6 -6 H622.8000000000001 V1042 H0 Z" fill="#b18e35" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">when btnDelete.Click</text><text x="12" y="50">do</text><g transform="translate(32 60)"><path d="M0 0 H20 l6 6 h12 l6 -6 H590.8000000000001 V44 H67 c-8 0 -8 12 0 12 H590.8000000000001 V396 H76 l-6 6 H58 l-6 -6 H32 V830 H52 l6 6 h12 l6 -6 H590.8000000000001 V870 H76 l-6 6 H58 l-6 -6 H32 V952 H52 l6 6 h12 l6 -6 H590.8000000000001 V964 H44 l-6 6 H26 l-6 -6 H0 Z" fill="#b18e35" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">if</text><text x="12" y="55"></text><g transform="translate(67 38)"><path d="M0 0 H498.6 V44 H67 c-8 0 -8 12 0 12 H498.6 V172 H67 c-8 0 -8 12 0 12 H498.6 V328 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#77ab41" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">and</text><text x="12" y="55"></text><g transform="translate(67 38)"><path d="M0 0 H292.20000000000005 V44 H67 c-8 0 -8 12 0 12 H292.20000000000005 V88 H67 c-8 0 -8 12 0 12 H292.20000000000005 V120 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#3f71b5" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">&gt;</text><text x="12" y="55"></text><g transform="translate(67 38)"><path d="M0 0 H225.20000000000005 V36 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#439970" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">ListView1.SelectionIndex</text></g><text x="12" y="99"></text><g transform="translate(67 82)"><path d="M0 0 H170 V36 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#3f71b5" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">0</text></g></g><text x="12" y="183"></text><g transform="translate(67 166)"><path d="M0 0 H431.6 V44 H67 c-8 0 -8 12 0 12 H431.6 V88 H67 c-8 0 -8 12 0 12 H431.6 V160 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#3f71b5" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">≤</text><text x="12" y="55"></text><g transform="translate(67 38)"><path d="M0 0 H225.20000000000005 V36 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#439970" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">ListView1.SelectionIndex</text></g><text x="12" y="99"></text><g transform="translate(67 82)"><path d="M0 0 H364.6 V44 H147.2 c-8 0 -8 12 0 12 H364.6 V76 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#49a6d4" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">length of list</text><text x="12" y="55">list</text><g transform="translate(147.2 38)"><path d="M0 0 H217.40000000000003 V36 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#d05f2d