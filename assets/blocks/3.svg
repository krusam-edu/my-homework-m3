<svg xmlns="http://www.w3.org/2000/svg" width="610.8000000000001" height="1778" viewBox="0 0 610.8000000000001 1778" role="img" aria-labelledby="title desc"><title id="title">Blocks 3 — บันทึกการบ้านและ TinyDB</title><desc id="desc">เปิด btnSave → ลาก when btnSave.Click ลงพื้นที่ว่าง Control → ลาก if then เสียบใน do คลิกเฟืองลาก else เข้า if แล้วปิดหน้าต่างเฟือง Logic → ลาก or เสียบเงื่อนไข if แล้วลาก or อีกชิ้นเสียบช่องที่สองของ or แรก เพื่อรวม 3 เงื่อนไข Logic → ลาก = จำนวน 3 ชิ้น เสียบช่องแรกของ or แรก และสองช่องของ or ที่ซ้อนอยู่ Text → ลาก trim 3 ชิ้น เสียบด้านซ้ายของ = แต่ละชิ้น แล้วเปิด txtSubject, txtHomework, txtDueDate ลากบล็อกอ่าน .Text มาเสียบ trim ตามลำดับ Text → ลากข้อความว่าง 3 ชิ้น (ไม่ใส่เว้นวรรค) เสียบด้านขวาของ = ทั้งสาม Notifier1 → ลาก call Notifier1.ShowAlert ใส่ then แล้ว Text → ข้อความ กรุณากรอกข้อมูลให้ครบ เสียบ notice Lists → ลาก add items to list ใส่ else แล้ว Variables → get global homeworkList เสียบช่อง list Text → ลาก join เสียบ item เพิ่มช่องด้วยเฟืองให้ครบ 5 ช่อง จากบนลงล่างใส่ txtSubject.Text, ข้อความ “ | ”, txtHomework.Text, ข้อความ “ | ส่ง ”, txtDueDate.Text (อัญประกาศเป็นกรอบบล็อก ไม่ต้องพิมพ์) TinyDB1 → ลาก call TinyDB1.StoreValue ต่อใต้ add items ภายใน else; Text → ข้อความ homework เสียบ tag และ get global homeworkList เสียบ valueToStore Procedures → ลาก call RefreshList ต่อใต้ StoreValue ใน else เปิด TextBox แต่ละตัว → ลาก set txtSubject.Text to, set txtHomework.Text to, set txtDueDate.Text to ต่อเรียงใน else แล้วเสียบข้อความว่างทุกช่อง ListView1 → ลาก set ListView1.SelectionIndex to ต่อด้านล่าง แล้ว Math → เลข 0 เสียบช่อง to Notifier1 → ลาก ShowAlert ต่อท้าย else ใส่ข้อความ บันทึกการบ้านเรียบร้อย ใน notice</desc><style>text{font-family:Arial,Tahoma,sans-serif;font-size:14px;fill:white}svg{background:#f5f7fa}</style><g transform="translate(24 16)"><path d="M0 0 H562.8000000000001 V60 H76 l-6 6 H58 l-6 -6 H32 V1722 H52 l6 6 h12 l6 -6 H562.8000000000001 V1734 H0 Z" fill="#b18e35" stroke="#000" stroke-opacity=".23" stroke-width="1"