<svg xmlns="http://www.w3.org/2000/svg" width="693.2" height="318" viewBox="0 0 693.2 318" role="img" aria-labelledby="title desc"><title id="title">Blocks 4 — โหลดตอนเปิดแอป</title><desc id="desc">Screen1 → ลาก when Screen1.Initialize ลงพื้นที่ว่าง Variables → ลาก set global homeworkList to ใส่ do TinyDB1 → ลาก call TinyDB1.GetValue (บล็อกคืนค่า มีเดือยด้านซ้าย) เสียบช่อง to ของตัวแปร Text → ลากข้อความ homework เสียบ tag ให้สะกดและตัวพิมพ์ตรง StoreValue Lists → ลาก create empty list เสียบ valueIfTagNotThere เพื่อให้ครั้งแรกได้รายการว่าง Procedures → ลาก call RefreshList ต่อใต้ set global homeworkList to ภายใน do</desc><style>text{font-family:Arial,Tahoma,sans-serif;font-size:14px;fill:white}svg{background:#f5f7fa}</style><g transform="translate(24 16)"><path d="M0 0 H645.2 V60 H76 l-6 6 H58 l-6 -6 H32 V262 H52 l6 6 h12 l6 -6 H645.2 V274 H0 Z" fill="#b18e35" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">when Screen1.Initialize</text><text x="12" y="50">do</text><g transform="translate(32 60)"><path d="M0 0 H20 l6 6 h12 l6 -6 H613.2 V44 H240.80000000000007 c-8 0 -8 12 0 12 H613.2 V160 H44 l-6 6 H26 l-6 -6 H0 Z" fill="#d05f2d" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">set global homeworkList to</text><text x="12" y="55"></text><g transform="translate(240.80000000000007 38)"><path d="M0 0 H372.4 V44 H201.8 c-8 0 -8 12 0 12 H372.4 V88 H201.8 c-8 0 -8 12 0 12 H372.4 V120 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#7c5385" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">call TinyDB1.GetValue</text><text x="12" y="55">tag</text><g transform="translate(201.8 38)"><path d="M0 0 H170 V36 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#b32d5e" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">“homework”</text></g><text x="12" y="99">valueIfTagNotThere</text><g transform="translate(201.8 82)"><path d="M0 0 H170.59999999999997 V36 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#49a6d4" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">create empty list</text></g></g></g><g transform="translate(32 220)"><path d="M0 0 H20 l6 6 h12 l6 -6 H170 V36 H44 l-6 6 H26 l-6 -6 H0 Z" fill="#7c5385" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">call RefreshList</text></g></g></svg>