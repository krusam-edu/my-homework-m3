<svg xmlns="http://www.w3.org/2000/svg" width="707.8" height="442" viewBox="0 0 707.8 442" role="img" aria-labelledby="title desc"><title id="title">Blocks 2 — สร้าง RefreshList</title><desc id="desc">Procedures → ลาก to procedure do (แบบไม่มี result) คลิกชื่อเปลี่ยนเป็น RefreshList ไม่เพิ่มพารามิเตอร์ เปิด ListView1 ลาก set ListView1.Elements to วางในช่อง do Variables → ลาก get เลือก global homeworkList เสียบช่อง to ของ Elements เปิด lblCount ลาก set lblCount.Text to ต่อใต้คำสั่งแรกใน do Text → ลาก join เสียบช่อง to ของ lblCount.Text คลิกเฟืองแล้วเพิ่ม string ให้มี 3 ช่อง (หรือใช้ปุ่ม + หากเวอร์ชันนั้นมี) Text → ลากบล็อกข้อความ ใส่ การบ้านทั้งหมด ตามด้วยเว้นวรรค เสียบช่องแรกของ join Lists → ลาก length of list เสียบช่องที่สอง แล้วเสียบ get global homeworkList ในช่อง list Text → ลากข้อความ เว้นวรรคแล้วตามด้วย รายการ เสียบช่องสุดท้ายของ join</desc><style>text{font-family:Arial,Tahoma,sans-serif;font-size:14px;fill:white}svg{background:#f5f7fa}</style><g transform="translate(24 16)"><path d="M0 0 H659.8 V60 H76 l-6 6 H58 l-6 -6 H32 V386 H52 l6 6 h12 l6 -6 H659.8 V398 H0 Z" fill="#7c5385" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">to RefreshList</text><text x="12" y="50">do</text><g transform="translate(32 60)"><path d="M0 0 H20 l6 6 h12 l6 -6 H450.4000000000001 V44 H233.00000000000006 c-8 0 -8 12 0 12 H450.4000000000001 V76 H44 l-6 6 H26 l-6 -6 H0 Z" fill="#266643" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">set ListView1.Elements to</text><text x="12" y="55"></text><g transform="translate(233.00000000000006 38)"><path d="M0 0 H217.40000000000003 V36 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#d05f2d" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">get global homeworkList</text></g></g><g transform="translate(32 136)"><path d="M0 0 H20 l6 6 h12 l6 -6 H627.8 V44 H194 c-8 0 -8 12 0 12 H627.8 V244 H44 l-6 6 H26 l-6 -6 H0 Z" fill="#266643" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text 