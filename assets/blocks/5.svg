<svg xmlns="http://www.w3.org/2000/svg" width="560.6" height="282" viewBox="0 0 560.6 282" role="img" aria-labelledby="title desc"><title id="title">Blocks 5 — เลือกการบ้าน</title><desc id="desc">ListView1 → ลาก when ListView1.AfterPicking ลงพื้นที่ว่าง Notifier1 → ลาก call Notifier1.ShowAlert ใส่ช่อง do Text → ลาก join แบบ 2 ช่อง เสียบ notice Text → ข้อความ เลือก: ตามด้วยเว้นวรรค เสียบช่องแรก; ListView1 → บล็อกอ่าน ListView1.Selection เสียบช่องที่สอง ทดลองแตะการบ้านแถวหนึ่งบนโทรศัพท์ แล้วอ่านแจ้งเตือนก่อนกดปุ่มลบ; ตั้ง MultiSelect เป็น false ถ้ามี property นี้</desc><style>text{font-family:Arial,Tahoma,sans-serif;font-size:14px;fill:white}svg{background:#f5f7fa}</style><g transform="translate(24 16)"><path d="M0 0 H512.6 V60 H76 l-6 6 H58 l-6 -6 H32 V226 H52 l6 6 h12 l6 -6 H512.6 V238 H0 Z" fill="#b18e35" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">when ListView1.AfterPicking</text><text x="12" y="50">do</text><g transform="translate(32 60)"><path d="M0 0 H20 l6 6 h12 l6 -6 H480.6 V44 H225.20000000000005 c-8 0 -8 12 0 12 H480.6 V160 H44 l-6 6 H26 l-6 -6 H0 Z" fill="#7c5385" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">call Notifier1.ShowAlert</text><text x="12" y="55">notice</text><g transform="translate(225.20000000000005 38)"><path d="M0 0 H255.39999999999998 V44 H69.2 c-8 0 -8 12 0 12 H255.39999999999998 V88 H69.2 c-8 0 -8 12 0 12 H255.39999999999998 V120 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#b32d5e" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">join</text><text x="12" y="55"></text><g transform="translate(69.2 38)"><path d="M0 0 H170 V36 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#b32d5e" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">“เลือก: ”</text></g><text x="12" y="99"></text><g transform="translate(69.2 82)"><path d="M0 0 H186.2 V36 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#439970" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">ListView1.Selection</text></g></g></g></g></svg>