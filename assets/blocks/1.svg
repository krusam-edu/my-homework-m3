<svg xmlns="http://www.w3.org/2000/svg" width="514.0000000000001" height="120" viewBox="0 0 514.0000000000001 120" role="img" aria-labelledby="title desc"><title id="title">Blocks 1 — สร้างตัวแปรรายการ</title><desc id="desc">เปิดหน้า Blocks → Built-in → Variables แล้วลาก initialize global name to ลงพื้นที่ว่าง คลิก name พิมพ์ homeworkList (บล็อก get และ set จะอ้างชื่อนี้) เปิด Lists ลาก create empty list มาเสียบช่อง to ทางขวาให้แนบสนิท ไม่ใช้บล็อกข้อความที่พิมพ์คำว่า list</desc><style>text{font-family:Arial,Tahoma,sans-serif;font-size:14px;fill:white}svg{background:#f5f7fa}</style><g transform="translate(24 16)"><path d="M0 0 H466.0000000000001 V44 H295.40000000000015 c-8 0 -8 12 0 12 H466.0000000000001 V76 H0 Z" fill="#d05f2d" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">initialize global homeworkList to</text><text x="12" y="55"></text><g transform="translate(295.40000000000015 38)"><path d="M0 0 H170.59999999999997 V36 H0 V18 c-8 0 -8 -12 0 -12 Z" fill="#49a6d4" stroke="#000" stroke-opacity=".23" stroke-width="1"/><text x="12" y="22">create empty list</text></g></g></svg>