<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172a5e"><meta name="description" content="บทเรียนออนไลน์ MIT App Inventor สำหรับ ม.3 สร้างแอป My Homework แบบ Step-by-Step"><title>My Homework Lab | MIT App Inventor ม.3</title><link rel="stylesheet" href="style.css"></head>
<body><a class="skip" href="#main">ข้ามไปเนื้อหาบทเรียน</a><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-icon">▣</span><div><strong>My Homework Lab</strong><small>MIT App Inventor • ม.3</small></div></div><div class="student-panel"><label for="studentName">ชื่อนักเรียน</label><input id="studentName" placeholder="กรอกชื่อ–สกุล"><div class="two"><label>ชั้น <input id="studentClass" placeholder="ม.3/1"></label><label>เลขที่ <input id="studentNumber" placeholder="1" inputmode="numeric"></label></div></div><div class="progress"><div class="progress-row"><strong>ความก้าวหน้า</strong><span id="progressPercent">0%</span></div><div class="progress-bar"><span id="progressFill"></span></div><small id="progressDetail">เสร็จ 0 จาก 7 โมดูล</small></div><nav id="nav" aria-label="โมดูลบทเรียน"></nav><div class="side-actions"><button id="exportBtn" class="soft">↓ ส่งออกผลการเรียน (.json)</button><button id="printBtn" class="soft">⎙ พิมพ์ใบงาน/ผลการเรียน</button><button id="resetBtn" class="text-btn">ล้างความก้าวหน้าบนอุปกรณ์</button></div></aside><main id="main"><header class="top"><div><span class="eyebrow">บทเรียนออนไลน์แบบลงมือทำ</span><h1>สร้างแอปบันทึกการบ้าน <span>My Homework</span></h1><p>เรียนทีละ STEP • ทดลอง Blocks • ทำใบงาน • ตรวจสอบผลงาน</p></div><a class="external" href="https://ai2.appinventor.mit.edu/" target="_blank" rel="noopener noreferrer">เปิด MIT App Inventor ↗</a></header><div class="mobile-nav"><label for="moduleSelect">เลือกโมดูล</label><select id="moduleSelect"></select></div><div class="content"><div id="moduleArea"></div><footer class="footer-nav"><button id="prevBtn" class="soft">← ก่อนหน้า</button><span id="stepLabel"></span><button id="nextBtn" class="primary">โมดูลถัดไป →</button></footer></div></main></div><script src="app.js" defer></script></body></html>
